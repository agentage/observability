name: Publish Package

# Publishes @agentage/observability to npm. Manual (workflow_dispatch) or whenever
# package.json lands on master; a version already on npm is a no-op skip, so an
# ordinary dependency bump costs one cheap run. Requires an NPM_TOKEN repo secret.

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  # No commit-subject release gate: squash merges rewrite the subject to the PR title,
  # so a fix-titled PR carrying a version bump silently skipped publish. The
  # "already on npm" check below is the only idempotency gate this needs.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Skip if version already on npm
        id: ver
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.publish == 'true'
        run: npm run verify
      - name: Publish
        if: steps.ver.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if npm publish --access public --provenance 2>&1 | tee publish.log; then
            exit 0
          fi
          # npm's CDN 404-caches a just-published version for ~5min, so the check above
          # can report "not published" for a version the registry already holds.
          if grep -qiE 'EPUBLISHCONFLICT|E403|cannot publish over' publish.log; then
            echo "Version already on the registry - treating the conflict as a skip."
            exit 0
          fi
          exit 1
      - name: Tag
        if: steps.ver.outputs.publish == 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # publish may have been a conflict-skip, in which case the tag already exists
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already tagged."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
